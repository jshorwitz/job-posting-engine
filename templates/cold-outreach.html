<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;

    .container {
      max-width: 580px;
      margin: 0 auto;

    .body-text {
      white-space: pre-line;
      margin: 0;

    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #e5e5e5;
      font-size: 12px;
      color: #888888;
    }

</head>
<body>
  <div class="container">
    <div class="body-text">{{body}}</div>
    <div class="footer">
      <p>Joel Horwitz · Synter Media</p>
    </div>
  </div>

</html>
